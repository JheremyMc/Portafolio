<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local de Pinturas · Demo</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Google Sans',Roboto,Arial,sans-serif;color:#202124;background:#f7f8fb;}
  a{color:#1a73e8;text-decoration:none;}
  .top{background:#fff;border-bottom:1px solid #e8eaed;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .top .site{font-weight:700;font-size:17px;}
  .top .dem{font-size:12px;color:#80868b;background:#f1f3f4;border-radius:12px;padding:3px 10px;}
  .top .back{margin-left:auto;font-size:13px;}
  .bar{display:flex;gap:12px;padding:16px 24px 0;flex-wrap:wrap;align-items:center;}
  .bar input{flex:1;min-width:200px;border:1px solid #dadce0;border-radius:20px;padding:9px 16px;font:400 14px 'Google Sans',Roboto,sans-serif;}
  .bar input:focus{outline:none;border-color:#1a73e8;box-shadow:0 0 0 1px #1a73e8 inset;}
  .bar button{border:1px solid #dadce0;background:#fff;color:#3c4043;border-radius:16px;padding:7px 14px;font:500 13px 'Google Sans',Roboto,sans-serif;cursor:pointer;}
  .bar button.on{background:#1a73e8;border-color:#1a73e8;color:#fff;}
  .main{display:flex;gap:18px;padding:16px 24px 30px;flex-wrap:wrap;}
  .col{flex:1;min-width:300px;background:#fff;border:1px solid #e8eaed;border-radius:14px;padding:18px;}
  .col h2{font-size:16px;font-weight:600;margin:0 0 14px;}
  .prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .p{border:1px solid #e8eaed;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;}
  .p .sw{height:54px;border-radius:10px;border:1px solid #e8eaed;}
  .p .n{font-weight:600;font-size:14px;}
  .p .d{color:#5f6368;font-size:12px;}
  .p .pr{color:#1a73e8;font-weight:600;font-size:15px;}
  .p button{margin-top:auto;border:none;border-radius:16px;background:#1a73e8;color:#fff;padding:7px;font:500 13px 'Google Sans',Roboto,sans-serif;cursor:pointer;}
  .p button:hover{background:#1765cc;}
  .cart-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f6;font-size:14px;}
  .cart-row .name{flex:1;}
  .cart-row button{border:1px solid #dadce0;background:#fff;border-radius:10px;width:24px;height:24px;cursor:pointer;font-weight:700;color:#1a73e8;}
  .total{margin-top:14px;padding-top:10px;border-top:2px solid #eef1f6;display:flex;justify-content:space-between;font-weight:700;font-size:17px;}
  .msg{background:#e6f4ea;color:#188038;border-radius:10px;padding:10px 12px;font-size:13.5px;display:none;margin-top:10px;}
  .var{display:inline-block;border-radius:10px;padding:3px 10px;font-size:11.5px;color:#5f6368;background:#f1f3f4;}
  .foot{text-align:center;padding:18px 16px;color:#80868b;font-size:12.5px;}
</style>
</head>
<body>

<div class="top">
  <div class="site">Pinturas y Más</div>
  <span class="dem">Demo del portafolio</span>
  <a class="back" href="index.html">&larr; Volver al portafolio</a>
</div>

<div class="bar">
  <input id="bus" type="text" placeholder="Buscar pintura, color o presentación...">
  <button class="on" data-t="todos">Todos</button>
  <button data-t="interior">Interior</button>
  <button data-t="exterior">Exterior</button>
  <button data-t="madera">Madera</button>
</div>

<div class="main">
  <div class="col">
    <h2>Catálogo</h2>
    <div class="prod" id="prod"></div>
  </div>

  <div class="col">
    <h2>Carrito</h2>
    <div id="cart"></div>
    <div class="total"><span>TOTAL</span><span id="totalv">$ 0</span></div>
    <button id="pay" class="bar button" style="width:100%;margin-top:12px;background:#188038;border-color:#188038;color:#fff;font-size:14px;padding:10px;">Pagar</button>
    <div class="msg" id="msg">¡Compra registrada! Recibirás una confirmación por WhatsApp.</div>
  </div>
</div>

<div class="foot">Local de pinturas &middot; demo HTML/CSS/JS &middot; parte del portafolio del ingeniero</div>

<script>
var PROD = [
  {n:'Blanco brillante', d:'Vinilo 4L · cubrimiento total', p:82000, t:'interior', c:'#f6f6f4'},
  {n:'Blanco hielo mate', d:'Vinilo 4L · apta techo', p:78000, t:'interior', c:'#eef0ea'},
  {n:'Gris perla', d:'Esmalte acrílico 1L · tinturado', p:36000, t:'interior', c:'#c9c9cd'},
  {n:'Azul profundo', d:'Vinilo 4L · lavable', p:92000, t:'interior', c:'#2e5d8f'},
  {n:'Verde pradera', d:'Especial exteriores 4L · antifúngica', p:98000, t:'exterior', c:'#5c8351'},
  {n:'Terracota', d:'Fachada 4L · resistencia UV', p:105000, t:'exterior', c:'#b35d3c'},
  {n:'Gris piedra', d:'Fachada 4L · resistencia UV', p:100000, t:'exterior', c:'#8a8f98'},
  {n:'Caoba', d:'Barniz madera 1L · brillo', p:42000, t:'madera', c:'#6b3b26'},
  {n:'Cedro natural', d:'Protector madera 1L · semi mate', p:40000, t:'madera', c:'#9c6b43'},
  {n:'Nogal', d:'Verniz 1L · alta duración', p:45000, t:'madera', c:'#4f3422'}
];
function fmt(n){ return '$ ' + n.toLocaleString('es-CO'); }
var cart = {};
function renderProd(){
  var el = document.getElementById('prod');
  el.innerHTML = '';
  var q = (document.getElementById('bus').value || '').toLowerCase();
  var t = document.querySelector('.bar button.on').dataset.t;
  PROD.forEach(function(p){
    if (t !== 'todos' && p.t !== t) return;
    if (q && (p.n + ' ' + p.d).toLowerCase().indexOf(q) < 0) return;
    var d = document.createElement('div');
    d.className = 'p';
    d.innerHTML = '<div class="sw" style="background:' + p.c + '"></div>' +
      '<div class="n">' + p.n + '</div><div class="d">' + p.d + '</div><div class="pr">' + fmt(p.p) + '</div><span class="var">' + (p.t === 'interior' ? 'Interior' : p.t === 'exterior' ? 'Exterior' : 'Madera') + '</span>';
    var b = document.createElement('button');
    b.textContent = 'Agregar';
    b.onclick = function(){
      cart[p.n] = (cart[p.n] || {prod: p, q: 0});
      cart[p.n].q++;
      renderCart();
    };
    d.appendChild(b);
    el.appendChild(d);
  });
  if (!el.children.length) el.innerHTML = '<div style="color:#80868b;font-size:13px">Sin resultados.</div>';
}
function renderCart(){
  var el = document.getElementById('cart');
  el.innerHTML = '';
  var total = 0;
  Object.keys(cart).forEach(function(k){
    var o = cart[k];
    total += o.prod.p * o.q;
    var r = document.createElement('div');
    r.className = 'cart-row';
    r.innerHTML = '<div class="name">' + k + '</div>' +
      '<div style="display:flex;align-items:center;gap:8px"><button data-k="' + k + '" data-d="-1">-</button>' + o.q + '<button data-k="' + k + '" data-d="1">+</button></div>' +
      '<div style="font-weight:600">' + fmt(o.prod.p * o.q) + '</div>';
    r.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){
        cart[b.dataset.k].q += parseInt(b.dataset.d, 10);
        if (cart[b.dataset.k].q <= 0) delete cart[b.dataset.k];
        renderCart();
      };
    });
    el.appendChild(r);
  });
  if (!Object.keys(cart).length) el.innerHTML = '<div style="color:#80868b;font-size:13px">Tu carrito está vacío.</div>';
  document.getElementById('totalv').textContent = fmt(total);
}
document.getElementById('bus').oninput = renderProd;
document.querySelectorAll('.bar button').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('.bar button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    renderProd();
  };
});
document.getElementById('pay').onclick = function(){
  if (!Object.keys(cart).length){ alert('Agrega un producto.'); return; }
  document.getElementById('msg').style.display = 'block';
  setTimeout(function(){ document.getElementById('msg').style.display = 'none'; }, 3000);
};
renderProd();
renderCart();
</script>
</body>
</html>
