<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurante · Demo</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Google Sans',Roboto,Arial,sans-serif;color:#202124;background:#f7f8fb;}
  a{color:#1a73e8;text-decoration:none;}
  .top{background:#fff;border-bottom:1px solid #e8eaed;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .top .site{font-weight:700;font-size:17px;}
  .top .dem{font-size:12px;color:#80868b;background:#f1f3f4;border-radius:12px;padding:3px 10px;}
  .top .back{margin-left:auto;font-size:13px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:18px 24px 4px;}
  .kpi{background:#fff;border:1px solid #e8eaed;border-radius:12px;padding:12px 16px;box-shadow:0 1px 2px rgba(60,64,67,.1);}
  .kpi .l{font-size:11px;color:#5f6368;text-transform:uppercase;letter-spacing:.5px;}
  .kpi .v{font-size:22px;font-weight:600;margin-top:2px;}
  .main{display:flex;gap:18px;padding:14px 24px 30px;flex-wrap:wrap;}
  .col{flex:1;min-width:300px;background:#fff;border:1px solid #e8eaed;border-radius:14px;padding:18px;}
  .col h2{font-size:16px;font-weight:600;margin:0 0 12px;}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .tab{border:1px solid #dadce0;background:#fff;color:#3c4043;border-radius:16px;padding:6px 14px;font:500 13px 'Google Sans',Roboto,sans-serif;cursor:pointer;}
  .tab.on{background:#1a73e8;border-color:#1a73e8;color:#fff;}
  .menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .item{border:1px solid #e8eaed;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;}
  .item .n{font-weight:600;font-size:14px;}
  .item .d{color:#5f6368;font-size:12.5px;line-height:1.4;}
  .item .p{color:#1a73e8;font-weight:600;font-size:15px;}
  .item button{margin-top:auto;border:none;border-radius:16px;background:#1a73e8;color:#fff;padding:7px;font:500 13px 'Google Sans',Roboto,sans-serif;cursor:pointer;}
  .item button:hover{background:#1765cc;}
  .order-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f6;font-size:14px;}
  .order-row .name{flex:1;}
  .order-row .q{display:flex;align-items:center;gap:8px;}
  .order-row .q button{border:1px solid #dadce0;background:#fff;border-radius:10px;width:24px;height:24px;cursor:pointer;font-weight:700;color:#1a73e8;}
  .total{margin-top:14px;padding-top:10px;border-top:2px solid #eef1f6;display:flex;justify-content:space-between;font-weight:700;font-size:17px;}
  .msg{background:#e6f4ea;color:#188038;border-radius:10px;padding:10px 12px;font-size:13.5px;display:none;margin-top:10px;}
  .foot{text-align:center;padding:18px 16px;color:#80868b;font-size:12.5px;}
</style>
</head>
<body>

<div class="top">
  <div class="site">Restaurante La Brasa</div>
  <span class="dem">Demo del portafolio</span>
  <a class="back" href="index.html">&larr; Volver al portafolio</a>
</div>

<div class="kpis">
  <div class="kpi"><div class="l">Ventas del día</div><div class="v" id="kpfact">$ 0</div></div>
  <div class="kpi"><div class="l">Mesas activas</div><div class="v" id="kmesas">1</div></div>
  <div class="kpi"><div class="l">Pedidos pendientes</div><div class="v">Mesa 5</div></div>
</div>

<div class="main">
  <div class="col">
    <h2>Carta</h2>
    <div class="tabs" id="tabs">
      <button class="tab on" data-cat="todos">Todos</button>
      <button class="tab" data-cat="entradas">Entradas</button>
      <button class="tab" data-cat="principales">Principales</button>
      <button class="tab" data-cat="postres">Postres</button>
      <button class="tab" data-cat="bebidas">Bebidas</button>
    </div>
    <div class="menu" id="menu"></div>
  </div>

  <div class="col">
    <h2>Pedido · Mesa 5</h2>
    <div id="order"></div>
    <div class="total"><span>TOTAL</span><span id="totalv">$ 0</span></div>
    <button id="send" class="tab" style="width:100%;margin-top:12px;background:#188038;border-color:#188038;color:#fff;font-size:14px;padding:10px;">Enviar a cocina</button>
    <div class="msg" id="msg">Pedido enviado a cocina. ¡Gracias!</div>
  </div>
</div>

<div class="foot">Restaurante &middot; demo HTML/CSS/JS &middot; parte del portafolio del ingeniero</div>

<script>
var PLATOS = [
  {n:'Empanadas de queso', d:'3 unidades con ají casero', p:12000, c:'entradas'},
  {n:'Ceviche de camarón', d:'Fresco, con limón y maíz tostado', p:26000, c:'entradas'},
  {n:'Bandeja paisa', d:'Fríjoles, arroz, carne, chicharrón, huevo y aguacate', p:32000, c:'principales'},
  {n:'Filete de res a la parrilla', d:'Con papas a la francesa y ensalada', p:38000, c:'principales'},
  {n:'Pasta al pesto con pollo', d:'Albahaca fresca, queso parmesano', p:24000, c:'principales'},
  {n:'Tres leches', d:'Porción individual con canela', p:9000, c:'postres'},
  {n:'Tiramisú casero', d:'Café, mascarpone y cacao', p:11000, c:'postres'},
  {n:'Limonada natural', d:'Expresión con hierbabuena', p:7000, c:'bebidas'},
  {n:'Jugo de guanábana', d:'Natural, sin azúcar añadida', p:6000, c:'bebidas'}
];
function fmt(n){ return '$ ' + n.toLocaleString('es-CO'); }
var order = {};
function renderMenu(cat){
  var el = document.getElementById('menu');
  el.innerHTML = '';
  PLATOS.forEach(function(pl){
    if (cat !== 'todos' && pl.c !== cat) return;
    var d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = '<div class="n">' + pl.n + '</div><div class="d">' + pl.d + '</div><div class="p">' + fmt(pl.p) + '</div>';
    var b = document.createElement('button');
    b.textContent = 'Agregar al pedido';
    b.onclick = function(){
      order[pl.n] = (order[pl.n] || {plato: pl, q: 0});
      order[pl.n].q++;
      renderOrder();
    };
    d.appendChild(b);
    el.appendChild(d);
  });
}
function renderOrder(){
  var el = document.getElementById('order');
  el.innerHTML = '';
  var total = 0;
  Object.keys(order).forEach(function(k){
    var o = order[k];
    total += o.plato.p * o.q;
    var r = document.createElement('div');
    r.className = 'order-row';
    r.innerHTML = '<div class="name">' + k + '</div>' +
      '<div class="q"><button data-k="' + k + '" data-d="-1">-</button>' + o.q + '<button data-k="' + k + '" data-d="1">+</button></div>' +
      '<div style="font-weight:600">' + fmt(o.plato.p * o.q) + '</div>';
    r.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){
        order[b.dataset.k].q += parseInt(b.dataset.d, 10);
        if (order[b.dataset.k].q <= 0) delete order[b.dataset.k];
        renderOrder();
      };
    });
    el.appendChild(r);
  });
  if (!Object.keys(order).length) el.innerHTML = '<div style="color:#80868b;font-size:13px">Aún no hay platos en el pedido.</div>';
  document.getElementById('totalv').textContent = fmt(total);
}
document.getElementById('tabs').addEventListener('click', function(e){
  if (e.target.classList.contains('tab')){
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('on'); });
    e.target.classList.add('on');
    renderMenu(e.target.dataset.cat);
  }
});
document.getElementById('send').addEventListener('click', function(){
  if (!Object.keys(order).length) return;
  document.getElementById('msg').style.display = 'block';
  setTimeout(function(){ document.getElementById('msg').style.display = 'none'; }, 2500);
});
renderMenu('todos');
renderOrder();
</script>
</body>
</html>
